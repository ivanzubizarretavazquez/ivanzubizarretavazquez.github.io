<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Iván Zubizarreta — Security is a living system</title>
<meta name="description" content="An immersive journey through a digital system: network, threat, attack, defense, human, future. Cybersecurity portfolio of Iván Zubizarreta." />
<meta name="theme-color" content="#ffffff" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap" rel="stylesheet" />
<style>
/* ============================================================
   TOKENS
   ============================================================ */
:root{
  --white:#FFFFFF;
  --off:#F5F8FC;
  --ice:#EDF3FA;
  --electric:#1677FF;
  --deep:#0645C0;
  --ink:#07111F;

  --text:#07111F;
  --muted:rgba(7,17,31,.46);
  --hair:rgba(7,17,31,.10);

  --font:'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;

  --ease:cubic-bezier(.22,.61,.36,1);
  --pad: clamp(20px, 4vw, 56px);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{background:var(--white); -webkit-text-size-adjust:100%}
body{
  font-family:var(--font);
  color:var(--text);
  background:var(--white);
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}
body.is-loading{overflow:hidden}
a{color:inherit}
::selection{background:rgba(22,119,255,.16)}

/* Scroll track: the document height IS the timeline */
#track{height:760vh; position:relative; z-index:0; pointer-events:none}

/* ============================================================
   STAGE
   ============================================================ */
#stage{
  position:fixed; inset:0; z-index:1;
  background:
    radial-gradient(120% 90% at 50% 40%, #FFFFFF 0%, #FBFDFF 45%, var(--ice) 100%);
}
#gl{display:block; width:100%; height:100%}

/* Whiteout used at the end of THE ATTACK */
#whiteout{
  position:fixed; inset:0; z-index:6; background:#fff; opacity:0;
  pointer-events:none; will-change:opacity;
}

/* Vignette to push depth without darkening the palette */
#atmosphere{
  position:fixed; inset:0; z-index:2; pointer-events:none;
  background:
    radial-gradient(70% 55% at 50% 50%, rgba(255,255,255,0) 40%, rgba(255,255,255,.72) 100%);
}

/* ============================================================
   TYPOGRAPHY LAYER (statements)
   ============================================================ */
#statements{
  position:fixed; inset:0; z-index:7; pointer-events:none;
  display:flex; align-items:center; justify-content:center;
  padding:var(--pad);
}
.beat{
  position:absolute; opacity:0; will-change:opacity, transform;
  max-width:min(1040px, 84vw);
  text-align:center;
}
.beat h1,.beat h2{
  margin:0;
  font-weight:200;
  letter-spacing:-.035em;
  line-height:.98;
  font-size:clamp(30px, 6.4vw, 92px);
}
.beat .sub{
  margin-top:clamp(12px,1.6vw,22px);
  font-size:clamp(12px,1.15vw,17px);
  font-weight:300;
  letter-spacing:.01em;
  color:var(--muted);
}
.beat .kicker{
  display:block;
  font-size:clamp(10px,.82vw,12px);
  font-weight:500;
  letter-spacing:.34em;
  color:var(--electric);
  margin-bottom:clamp(14px,2vw,26px);
}
.beat.tight h2{font-size:clamp(26px,4.6vw,62px); line-height:1.06}
.beat .terms{
  display:flex; flex-wrap:wrap; gap:clamp(14px,3vw,44px); justify-content:center;
  margin-top:clamp(22px,3vw,44px);
}
.beat .terms span{
  font-size:clamp(11px,1vw,14px); font-weight:300; letter-spacing:.22em;
  color:var(--muted);
}
.beat .terms span:nth-child(4){color:var(--electric)}

/* Final call to action */
#cta{
  position:fixed; z-index:8; left:50%; transform:translate(-50%,0);
  bottom:clamp(56px,9vh,120px); opacity:0; pointer-events:none;
  display:flex; gap:14px; align-items:center; flex-wrap:wrap; justify-content:center;
}
.action{
  pointer-events:auto; cursor:pointer;
  border:1px solid rgba(7,17,31,.16); background:rgba(255,255,255,.7);
  backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
  color:var(--text); font-family:inherit;
  font-size:12px; font-weight:400; letter-spacing:.26em;
  padding:15px 30px; border-radius:999px; text-decoration:none;
  transition:border-color .45s var(--ease), color .45s var(--ease), background .45s var(--ease);
}
.action:hover,.action:focus-visible{border-color:var(--electric); color:var(--deep); background:#fff}
.action.primary{border-color:rgba(22,119,255,.5); color:var(--deep)}

/* ============================================================
   SPATIAL LABELS (anchored to 3D positions)
   ============================================================ */
#spatial{position:fixed; inset:0; z-index:5; pointer-events:none; overflow:hidden}
.slabel{
  position:absolute; transform:translate(-50%,-50%); opacity:0;
  white-space:nowrap; will-change:transform,opacity;
}
.slabel .line{
  width:34px; height:1px; background:linear-gradient(90deg, var(--electric), rgba(22,119,255,0));
  margin-bottom:8px;
}
.slabel .t{
  font-size:11px; font-weight:400; letter-spacing:.28em; color:var(--deep);
}
.slabel .d{
  font-size:10.5px; font-weight:300; letter-spacing:.06em; color:var(--muted); margin-top:5px;
}

/* Node inspector — reads like an instrument, not a modal */
#inspector{
  position:fixed; z-index:9; pointer-events:none; opacity:0;
  transform:translate(0,-50%); will-change:transform,opacity;
  padding-left:18px; border-left:1px solid rgba(22,119,255,.35);
  max-width:270px;
}
#inspector .name{font-size:12px; letter-spacing:.3em; font-weight:500; color:var(--ink)}
#inspector .meta{font-size:11.5px; font-weight:300; color:var(--muted); margin-top:8px; line-height:1.6; letter-spacing:.01em}
#inspector .risk{margin-top:12px; display:flex; align-items:center; gap:8px; font-size:10px; letter-spacing:.24em; color:var(--electric)}
#inspector .risk i{width:22px; height:1px; background:var(--electric); display:block; font-style:normal}
#inspector .more{margin-top:14px; font-size:10px; letter-spacing:.24em; color:var(--deep); opacity:.75}

/* Project world panel */
#project{
  position:fixed; z-index:12; inset:auto 0 0 0; padding:var(--pad);
  background:linear-gradient(180deg, rgba(255,255,255,0), rgba(255,255,255,.92) 22%, #fff 60%);
  transform:translateY(101%); transition:transform .9s var(--ease);
  pointer-events:none;
}
#project.open{transform:translateY(0); pointer-events:auto}
#project .inner{max-width:720px; margin:0 auto; padding-bottom:clamp(10px,3vh,30px)}
#project .idx{font-size:10px; letter-spacing:.34em; color:var(--electric)}
#project h3{margin:14px 0 0; font-weight:200; letter-spacing:-.03em; font-size:clamp(28px,4vw,50px); line-height:1.02}
#project p{margin:16px 0 0; font-weight:300; font-size:clamp(14px,1.2vw,16.5px); line-height:1.7; color:rgba(7,17,31,.72); max-width:62ch}
#project .facts{display:flex; flex-wrap:wrap; gap:10px; margin-top:22px}
#project .facts span{font-size:10.5px; letter-spacing:.16em; color:var(--muted); border:1px solid var(--hair); border-radius:999px; padding:8px 14px}
#project .row{display:flex; gap:12px; margin-top:26px; flex-wrap:wrap}
#project .close{
  position:absolute; top:calc(var(--pad) * .6); right:var(--pad);
  background:none; border:none; cursor:pointer; font-family:inherit;
  font-size:10px; letter-spacing:.28em; color:var(--muted); padding:10px;
}
#project .close:hover{color:var(--ink)}

/* ============================================================
   CHROME: navigation, progress, audio, identity
   ============================================================ */
#nav{
  position:fixed; z-index:10; right:clamp(14px,2.4vw,34px); top:50%;
  transform:translateY(-50%); display:flex; flex-direction:column; gap:2px;
  opacity:0; transition:opacity 1.2s var(--ease);
}
#nav.ready{opacity:1}
.navbtn{
  display:flex; align-items:center; gap:12px; justify-content:flex-end;
  background:none; border:none; cursor:pointer; font-family:inherit;
  padding:9px 0; color:var(--muted);
}
.navbtn .num{font-size:10px; letter-spacing:.18em; font-variant-numeric:tabular-nums; transition:color .5s var(--ease)}
.navbtn .name{
  font-size:10px; letter-spacing:.26em; opacity:0; transform:translateX(6px);
  transition:opacity .5s var(--ease), transform .5s var(--ease); white-space:nowrap;
}
.navbtn .bar{width:16px; height:1px; background:currentColor; opacity:.4; transition:width .5s var(--ease), opacity .5s var(--ease)}
.navbtn:hover .name,.navbtn:focus-visible .name{opacity:.6; transform:translateX(0)}
.navbtn:hover .bar{width:26px; opacity:.9}
.navbtn.active{color:var(--electric)}
.navbtn.active .bar{width:32px; opacity:1}
.navbtn.active .name{opacity:1; transform:translateX(0)}

#identity{
  position:fixed; z-index:10; left:var(--pad); top:clamp(18px,3vh,32px);
  opacity:0; transition:opacity 1.4s var(--ease);
}
#identity.ready{opacity:1}
#identity .n{font-size:12px; letter-spacing:.2em; font-weight:500}
#identity .r{font-size:10px; letter-spacing:.22em; color:var(--muted); margin-top:6px}

#hud{
  position:fixed; z-index:10; left:var(--pad); bottom:clamp(18px,3vh,30px);
  display:flex; align-items:center; gap:16px; opacity:0; transition:opacity 1.4s var(--ease);
}
#hud.ready{opacity:1}
#nav,#hud,#identity,#cta{transition:opacity .6s var(--ease)}
#audio{
  background:none; border:1px solid var(--hair); border-radius:999px; cursor:pointer;
  font-family:inherit; font-size:9.5px; letter-spacing:.24em; color:var(--muted);
  padding:9px 16px; transition:color .4s var(--ease), border-color .4s var(--ease);
}
#audio:hover,#audio:focus-visible{color:var(--deep); border-color:rgba(22,119,255,.45)}
#audio[aria-pressed="true"]{color:var(--electric); border-color:rgba(22,119,255,.45)}
#scenelabel{font-size:9.5px; letter-spacing:.26em; color:var(--muted)}

#hint{
  position:fixed; z-index:10; left:50%; transform:translateX(-50%);
  bottom:clamp(18px,3vh,30px); font-size:9.5px; letter-spacing:.3em; color:var(--muted);
  opacity:0; transition:opacity 1s var(--ease); pointer-events:none;
}

/* ============================================================
   CURSOR LENS
   ============================================================ */
#lens{
  position:fixed; z-index:11; top:0; left:0; width:38px; height:38px; margin:-19px 0 0 -19px;
  border:1px solid rgba(22,119,255,.42); border-radius:50%; pointer-events:none;
  transition:width .45s var(--ease), height .45s var(--ease), margin .45s var(--ease), border-color .45s var(--ease), opacity .4s;
  opacity:0; mix-blend-mode:multiply;
}
#lens.on{opacity:1}
#lens.hot{width:66px; height:66px; margin:-33px 0 0 -33px; border-color:rgba(6,69,192,.75)}
#lens::after{
  content:''; position:absolute; inset:0; margin:auto; width:3px; height:3px; border-radius:50%;
  background:var(--electric);
}
.no-lens #lens{display:none}

/* ============================================================
   LOADER — system initialization
   ============================================================ */
#loader{
  position:fixed; inset:0; z-index:20; background:var(--white);
  display:flex; align-items:center; justify-content:center;
  transition:opacity 1.1s var(--ease); padding:var(--pad);
}
#loader.done{opacity:0; pointer-events:none}
#loader .seq{width:min(320px,80vw)}
#loader .ln{
  font-size:10.5px; letter-spacing:.28em; color:var(--muted); opacity:0;
  display:flex; justify-content:space-between; gap:20px; padding:7px 0;
  transition:opacity .6s var(--ease), color .6s var(--ease);
}
#loader .ln.on{opacity:1}
#loader .ln.ok{color:rgba(7,17,31,.34)}
#loader .ln.ok em{color:var(--electric)}
#loader .ln em{font-style:normal; font-variant-numeric:tabular-nums}
#loader .meter{height:1px; background:var(--hair); margin-top:26px; position:relative; overflow:hidden}
#loader .meter i{position:absolute; inset:0 100% 0 0; background:var(--electric); transition:right .5s var(--ease)}

/* ============================================================
   NO-WEBGL FALLBACK
   ============================================================ */
#fallback{
  position:relative; z-index:13; background:var(--white);
  padding:clamp(60px,14vh,160px) 0 clamp(50px,10vh,110px);
  border-top:1px solid var(--hair);
}
body.nogl #stage,body.nogl #spatial,body.nogl #statements,body.nogl #lens,body.nogl #nav,body.nogl #hint,body.nogl #atmosphere,body.nogl #cta,body.nogl #inspector{display:none}
body.nogl #track{height:auto}
body.nogl #fallback{padding-top:clamp(30px,6vh,60px); border-top:none}
body.landed #nav,body.landed #hud,body.landed #identity,body.landed #lens,body.landed #cta{opacity:0; pointer-events:none}
#fallback .fb-wrap{max-width:1040px; margin:0 auto; padding:0 var(--pad)}

/* ---- dossier: the readable layer you land on after the journey ---- */
.dsr-head{border-bottom:1px solid var(--hair); padding-bottom:clamp(28px,5vh,52px)}
.dsr-head .eyebrow{font-size:10px; letter-spacing:.34em; color:var(--electric)}
.dsr-head h2{
  margin:clamp(18px,3vh,30px) 0 0; font-weight:200; letter-spacing:-.04em;
  font-size:clamp(34px,7vw,84px); line-height:.96; max-width:16ch;
}
.dsr-head .lede{margin:clamp(20px,3vh,30px) 0 0; font-weight:300; font-size:clamp(15px,1.35vw,18px); line-height:1.72; color:rgba(7,17,31,.72); max-width:58ch}
.dsr-head .quick{display:flex; flex-wrap:wrap; gap:10px 26px; margin-top:clamp(24px,4vh,38px); font-size:12px; letter-spacing:.06em; color:var(--muted)}
.dsr-head .quick a{color:var(--deep); text-decoration:none; border-bottom:1px solid rgba(22,119,255,.28); padding-bottom:2px}
.dsr-head .quick a:hover{border-color:var(--deep)}

.sec{padding:clamp(48px,9vh,96px) 0; border-bottom:1px solid var(--hair)}
.sec:last-child{border-bottom:none}
.sec-h{display:flex; align-items:baseline; gap:16px; margin-bottom:clamp(28px,4vh,46px)}
.sec-h b{font-size:10px; letter-spacing:.2em; color:var(--electric); font-weight:500; font-variant-numeric:tabular-nums}
.sec-h h3{margin:0; font-weight:300; font-size:clamp(19px,2.2vw,27px); letter-spacing:-.02em}

.entry{display:grid; grid-template-columns:132px 1fr; gap:clamp(14px,3vw,40px); padding:26px 0; border-top:1px solid var(--hair)}
.entry:first-of-type{border-top:none; padding-top:0}
.entry .when{font-size:11.5px; letter-spacing:.1em; color:var(--muted); font-variant-numeric:tabular-nums; padding-top:4px}
.entry h4{margin:0; font-weight:400; font-size:clamp(16px,1.6vw,20px); letter-spacing:-.01em}
.entry .org{margin:7px 0 0; font-size:12.5px; letter-spacing:.05em; color:var(--electric)}
.entry p{margin:12px 0 0; font-weight:300; font-size:14.5px; line-height:1.7; color:rgba(7,17,31,.66); max-width:62ch}

/* credential: reads like a signed record, not a certificate scan */
.cred{border:1px solid var(--hair); padding:clamp(20px,2.6vw,30px); margin-top:18px; position:relative; background:linear-gradient(180deg,#fff, #FCFDFF)}
.cred:first-of-type{margin-top:0}
.cred .top{display:flex; justify-content:space-between; gap:18px; align-items:flex-start; flex-wrap:wrap}
.cred .inst{font-size:11px; letter-spacing:.22em; color:var(--muted)}
.cred .state{font-size:10px; letter-spacing:.2em; color:var(--electric); display:flex; align-items:center; gap:8px}
.cred .state i{width:5px; height:5px; border-radius:50%; background:var(--electric); display:block}
.cred h4{margin:14px 0 0; font-weight:300; font-size:clamp(18px,2vw,25px); letter-spacing:-.02em; max-width:32ch}
.cred .fields{display:flex; flex-wrap:wrap; gap:8px 34px; margin-top:20px}
.cred .fields div{font-size:12px; color:var(--muted); font-variant-numeric:tabular-nums}
.cred .fields div em{font-style:normal; color:var(--ink); letter-spacing:.02em}
.cred details{margin-top:20px; border-top:1px solid var(--hair); padding-top:16px}
.cred summary{cursor:pointer; font-size:11px; letter-spacing:.2em; color:var(--deep); list-style:none}
.cred summary::-webkit-details-marker{display:none}
.cred summary::before{content:'+ '; color:var(--electric)}
.cred details[open] summary::before{content:'– '}
.cred .mods{margin-top:18px; display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:22px}
.cred .mods h5{margin:0 0 10px; font-size:11px; letter-spacing:.16em; color:var(--electric); font-weight:500}
.cred .mods ul{margin:0; padding:0; list-style:none}
.cred .mods li{font-size:13px; font-weight:300; line-height:1.65; color:rgba(7,17,31,.66)}

.chips{display:flex; flex-wrap:wrap; gap:9px}
.chips span{font-size:12px; letter-spacing:.04em; color:rgba(7,17,31,.7); border:1px solid var(--hair); border-radius:999px; padding:9px 15px}
.chips span.key{border-color:rgba(22,119,255,.4); color:var(--deep)}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); gap:clamp(24px,4vw,52px)}
.cols h5{margin:0 0 16px; font-size:11px; letter-spacing:.2em; color:var(--muted); font-weight:400}

.work{display:grid; grid-template-columns:132px 1fr; gap:clamp(14px,3vw,40px); padding:30px 0; border-top:1px solid var(--hair)}
.work:first-of-type{border-top:none; padding-top:0}
.work .no{font-size:11.5px; letter-spacing:.16em; color:var(--electric); font-variant-numeric:tabular-nums; padding-top:5px}
.work h4{margin:0; font-weight:300; font-size:clamp(20px,2.4vw,30px); letter-spacing:-.02em}
.work .tag{margin:8px 0 0; font-size:12.5px; letter-spacing:.05em; color:var(--muted)}
.work p{margin:14px 0 0; font-weight:300; font-size:14.5px; line-height:1.72; color:rgba(7,17,31,.7); max-width:64ch}
.work .foot{display:flex; flex-wrap:wrap; align-items:center; gap:10px 18px; margin-top:18px}
.work .foot .st{font-size:11px; letter-spacing:.14em; color:var(--muted)}
.work .foot a{font-size:11px; letter-spacing:.2em; color:var(--deep); text-decoration:none; border-bottom:1px solid rgba(22,119,255,.3); padding-bottom:3px}
.work .foot a:hover{border-color:var(--deep)}

.contact{display:flex; flex-wrap:wrap; gap:clamp(20px,5vw,80px); align-items:flex-end; justify-content:space-between}
.contact .big{font-weight:200; font-size:clamp(28px,4.6vw,58px); letter-spacing:-.035em; line-height:1.02; margin:0; max-width:14ch}
.contact .ways{display:flex; flex-direction:column; gap:12px}
.contact .ways a,.contact .ways span{font-size:14px; letter-spacing:.02em; color:rgba(7,17,31,.72); text-decoration:none}
.contact .ways a:hover{color:var(--deep)}
.colophon{padding:34px 0 10px; font-size:11px; letter-spacing:.08em; color:rgba(7,17,31,.34); display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px}

@media (max-width:700px){
  .entry,.work{grid-template-columns:1fr; gap:10px}
  .entry .when,.work .no{padding-top:0}
}

#langswitch{display:flex; align-items:center; gap:5px}
#langswitch button{
  background:none; border:none; cursor:pointer; font-family:inherit; padding:4px 2px;
  font-size:9.5px; letter-spacing:.22em; color:var(--muted); transition:color .35s var(--ease);
}
#langswitch span{font-size:9.5px; color:rgba(7,17,31,.2)}
#langswitch button:hover{color:var(--deep)}
#langswitch button.on{color:var(--electric)}

/* ============================================================
   ACCESSIBILITY
   ============================================================ */
:focus-visible{outline:2px solid var(--electric); outline-offset:4px}
.sr{position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0}
.skip{position:fixed; z-index:30; left:var(--pad); top:12px; transform:translateY(-200%); background:#fff; border:1px solid var(--electric); padding:12px 18px; font-size:11px; letter-spacing:.2em; text-decoration:none; transition:transform .3s}
.skip:focus{transform:translateY(0)}

@media (max-width:820px){
  #nav{right:12px}
  .navbtn .name{display:none}
  #hint{display:none}
  #identity .r{display:none}
  #inspector{max-width:210px}
}
@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto !important}
  #lens{display:none}
}
</style>
</head>

<!-- ================= STAGE ================= -->
<div id="stage"><canvas id="gl"></canvas></div>
<div id="atmosphere"></div>
<div id="whiteout"></div>
<div id="spatial"></div>

<!-- ================= STATEMENTS ================= -->
<div id="statements" aria-hidden="true"></div>

<div id="cta">
  <a class="action primary" href="#readable" id="ctaEnter"></a>
  <a class="action" id="ctaMail" href="#" data-p="mail"></a>
</div>

<!-- ================= INSTRUMENTS ================= -->
<div id="inspector" aria-hidden="true">

   ========================================================================== */
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function smooth(t) { return t * t * (3 - 2 * t); }
function range(v, a, b) { return clamp((v - a) / (b - a || 1e-6), 0, 1); }
/* Ramp that rises over [a,b], holds, then falls over [c,d] */
function window4(v, a, b, c, d) {
  if (v <= a || v >= d) return 0;
  if (v < b) return smooth(range(v, a, b));
  if (v > c) return 1 - smooth(range(v, c, d));
  return 1;
}
function hash(i) { var x = Math.sin(i * 127.1) * 43758.5453; return x - Math.floor(x); }

var PALETTE = [
  'const vec3 C_ELECTRIC = vec3(0.086, 0.467, 1.0);',
  'const vec3 C_DEEP     = vec3(0.024, 0.271, 0.753);',
  'const vec3 C_INK      = vec3(0.027, 0.067, 0.122);',
  'const vec3 C_ICE      = vec3(0.929, 0.953, 0.980);'
].join('\n');

/* --------------------------------------------------------------------------
   NetworkGraph — procedural corridor of nodes ordered along -Z
   -------------------------------------------------------------------------- */
var NET = (function buildNetwork() {
  var n = Q.nodes;
  var pos = new Float32Array(n * 3);
  var size = new Float32Array(n);
  var kind = new Float32Array(n);
  var threat = new Float32Array(n);
  var seed = new Float32Array(n);
  var raw = [];

  for (var i = 0; i < n; i++) {
    var t = i / (n - 1);
    // clustered depth: denser bands make the corridor feel architectural
    var band = Math.floor(t * 14);
    var jz = (hash(i * 3.1) - 0.5) * 46;
    var z = lerp(Z_NEAR, Z_FAR, t) + jz;
    var ang = hash(i * 7.7) * Math.PI * 2 + band * 0.5;
    var rad = 8 + Math.pow(hash(i * 5.3), 0.62) * (52 + 26 * Math.sin(t * 6.0));
    var x = Math.cos(ang) * rad;
    var y = Math.sin(ang) * rad * 0.72 + (hash(i * 11.7) - 0.5) * 14;

    pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z;
    seed[i] = hash(i * 2.3);
    var r = hash(i * 13.9);
    kind[i] = r > 0.94 ? 2 : (r > 0.72 ? 1 : 0);
    size[i] = (kind[i] === 2 ? 3.4 : kind[i] === 1 ? 2.3 : 1.5) * (0.7 + seed[i] * 0.8);

    // anomalous region: a pocket of the network that stops behaving
    var dz = z + 300;
    var inZone = Math.abs(dz) < 95 && Math.abs(x) < 60 && Math.abs(y) < 46;
    threat[i] = inZone ? (1 - Math.abs(dz) / 95) : 0;
    raw.push({ x: x, y: y, z: z, i: i });
  }

  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSize', new THREE.BufferAttribute(size, 1));
  g.setAttribute('aKind', new THREE.BufferAttribute(kind, 1));
  g.setAttribute('aThreat', new THREE.BufferAttribute(threat, 1));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  return { geo: g, pos: pos, raw: raw, count: n, threat: threat };
})();

var nodeMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false,
  vertexShader: [
    'attribute float aSize; attribute float aKind; attribute float aThreat; attribute float aSeed;',
    'uniform float uTime, uFogD, uThreat, uNetFade, uDPR, uMouseAmp, uContain, uPulse;',
    'uniform vec3 uMouse, uEpicentre;',
    'varying vec3 vColor; varying float vAlpha; varying float vCore;',
    PALETTE, FOG_CHUNK,
    'void main(){',
    '  vec3 p = position;',
    '  float breathe = sin(uTime*0.55 + aSeed*31.4)*0.9;',
    '  p.y += breathe;',
    '  p.x += cos(uTime*0.4 + aSeed*17.0)*0.7;',
    // anomaly: affected nodes jitter and drift out of formation
    '  float th = aThreat * uThreat;',
    '  p += vec3(sin(uTime*7.0+aSeed*40.0), cos(uTime*6.3+aSeed*22.0), sin(uTime*5.1+aSeed*13.0)) * th * 2.6;',
    // containment: the same nodes are pulled back into place
    '  p = mix(p, position, th * uContain * 0.9);',
    // cursor field: nearby nodes lean toward the lens
    '  float md = distance(p, uMouse);',
    '  p += normalize(p - uMouse + 0.001) * (-1.0) * uMouseAmp * exp(-md*md/900.0) * 2.2;',
    '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
    '  float depth = -mv.z;',
    '  float fog = fogMix(depth);',
    '  vec3 col = mix(C_ELECTRIC, C_DEEP, step(1.5, aKind));',
    '  col = mix(col, C_ICE*0.55 + C_ELECTRIC*0.45, step(aKind, 0.5));',
    '  col = mix(col, C_INK, th*0.85);',
    // detection shockwave washes through the graph
    '  float ring = 1.0 - smoothstep(0.0, 46.0, abs(distance(position, uEpicentre) - uPulse));',
    '  col = mix(col, C_ELECTRIC, ring * step(0.01, uPulse));',
    '  vColor = mix(col, vec3(1.0), fog*0.92);',
    '  float pulse = 0.72 + 0.28*sin(uTime*2.0 + aSeed*50.0);',
    '  vCore = step(1.5, aKind) + ring;',
    '  vAlpha = (1.0 - fog) * uNetFade * (0.45 + 0.55*pulse) * (1.0 - th*0.25) + ring*0.5*uNetFade;',
    '  gl_PointSize = aSize * uDPR * (260.0/max(depth, 1.0)) * (1.0 + ring*0.8 + th*0.4);',
    '  gl_Position = projectionMatrix * mv;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vColor; varying float vAlpha; varying float vCore;',
    'void main(){',
    '  vec2 uv = gl_PointCoord - 0.5;',
    '  float d = length(uv);',
    '  if(d > 0.5) discard;',
    '  float core = smoothstep(0.5, 0.06, d);',
    '  float halo = smoothstep(0.5, 0.0, d)*0.35;',
    '  float a = (core*0.85 + halo) * vAlpha;',
    '  if(a < 0.004) discard;',
    '  gl_FragColor = vec4(vColor, a);',
    '}'
  ].join('\n')
});
var nodes = new THREE.Points(NET.geo, nodeMat);
nodes.frustumCulled = false;
scene.add(nodes);

/* --------------------------------------------------------------------------
   Connections — neighbours along the corridor, not a random spaghetti
   -------------------------------------------------------------------------- */
var LINKS = (function buildLinks() {
  var pairs = [];
  var n = NET.count;
  var maxPer = Q.links;
  for (var i = 0; i < n; i++) {
    var made = 0;
    for (var k = 1; k <= 9 && made < maxPer; k++) {
      var j = i + k;
      if (j >= n) break;
      var dx = NET.pos[i*3] - NET.pos[j*3];
      var dy = NET.pos[i*3+1] - NET.pos[j*3+1];
      var dz = NET.pos[i*3+2] - NET.pos[j*3+2];
      var d2 = dx*dx + dy*dy + dz*dz;
      if (d2 < 1500 && hash(i * 3 + k * 7) > 0.34) { pairs.push(i, j); made++; }
    }
    // a few long-haul routes so the graph reads as infrastructure
    if (hash(i * 1.7) > 0.985) {
      var far = Math.min(n - 1, i + 40 + Math.floor(hash(i * 9.1) * 90));
      pairs.push(i, far);
    }
  }
  var m = pairs.length / 2;
  var lp = new Float32Array(m * 6);
  var la = new Float32Array(m * 2);
  var lt = new Float32Array(m * 2);
  for (var s = 0; s < m; s++) {
    var a = pairs[s*2], b = pairs[s*2+1];
    lp[s*6]   = NET.pos[a*3];   lp[s*6+1] = NET.pos[a*3+1]; lp[s*6+2] = NET.pos[a*3+2];
    lp[s*6+3] = NET.pos[b*3];   lp[s*6+4] = NET.pos[b*3+1]; lp[s*6+5] = NET.pos[b*3+2];
    var alpha = 0.10 + hash(s * 4.7) * 0.24;
    la[s*2] = alpha; la[s*2+1] = alpha;
    lt[s*2] = NET.threat[a]; lt[s*2+1] = NET.threat[b];
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(lp, 3));
  g.setAttribute('aAlpha', new THREE.BufferAttribute(la, 1));
  g.setAttribute('aThreat', new THREE.BufferAttribute(lt, 1));
  return { geo: g, pairs: pairs, segments: m };
})();

var linkMat = new THREE.ShaderMaterial({
  uniforms: U, transparent: true, depthWrite: false,
  vertexShader: [
    'attribute float aAlpha; attribute float aThreat;',
    'uniform float uTime, uFogD, uThreat, uNetFade, uContain, uPulse;',
    'uniform vec3 uEpicentre;',
    'varying vec3 vColor; varying float vAlpha;',
    PALETTE, FOG_CHUNK,
    'void main(){',
    '  vec3 p = position;',
    '  float th = aThreat * uThreat * (1.0 - uContain*0.85);',
    '  p += vec3(sin(uTime*5.0+p.z*0.3), cos(uTime*4.2+p.x*0.4), 0.0) * th * 1.8;',
    '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
    '  float depth = -mv.z;',
    '  float fog = fogMix(depth);',
    '  vec3 col = mix(C_ELECTRIC, C_INK, th*0.9);',
    '  float ring = 1.0 - smoothstep(0.0, 60.0, abs(distance(position, uEpicentre) - uPulse));',
    '  col = mix(col, C_DEEP, ring);',
    '  vColor = mix(col, vec3(1.0), fog*0.94);',
    '  vAlpha = aAlpha * (1.0 - fog) * uNetFade * (1.0 - th*0.55) + ring*0.25*uNetFade;',
    '  gl_Position = projectionMatrix * mv;',
    '}'
  ].join('\n'),
  fragmentShader: [
    'varying vec3 vColor; varying float vAlpha;',
    'void main(){ if(vAlpha < 0.004) discard; gl_FragColor = vec4(vColor, vAlpha); }'
  ].join('\n')
});
var links = new THREE.LineSegments(LINKS.geo, linkMat);
links.frustumCulled = false;
scene.add(links);

/* --------------------------------------------------------------------------
   DataStreams — packets riding existing edges, computed entirely on the GPU
   -------------------------------------------------------------------------- */
var packets = (function buildPackets() {
  var count = Math.min(Q.packets, LINKS.segments);
  var pos = new Float32Array(count * 3);
  var a = new Float32Array(count * 3);
  var b = new Float32Array(count * 3);
  var off = new Float32Array(count);
  var spd = new Float32Array(count);
  var th = new Float32Array(count);
  for (var i = 0; i < count; i++) {
    var s = Math.floor(hash(i * 6.1) * LINKS.segments);
    var ia = LINKS.pairs[s*2], ib = LINKS.pairs[s*2+1];
    a[i*3] = NET.pos[ia*3]; a[i*3+1] = NET.pos[ia*3+1]; a[i*3+2] = NET.pos[ia*3+2];
    b[i*3] = NET.pos[ib*3]; b[i*3+1] = NET.pos[ib*3+1]; b[i*3+2] = NET.pos[ib*3+2];
    off[i] = hash(i * 8.3);
    spd[i] = 0.06 + hash(i * 2.9) * 0.16;
    th[i] = Math.max(NET.threat[ia], NET.threat[ib]);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aA', new THREE.BufferAttribute(a, 3));
  g.setAttribute('aB', new THREE.BufferAttribute(b, 3));
  g.setAttribute('aOff', new THREE.BufferAttribute(off, 1));
  g.setAttribute('aSpd', new THREE.BufferAttribute(spd, 1));
  g.setAttribute('aThreat', new THREE.BufferAttribute(th, 1));

  var m = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false,
    vertexShader: [
      'attribute vec3 aA; attribute vec3 aB; attribute float aOff; attribute float aSpd; attribute float aThreat;',
      'uniform float uTime, uFogD, uThreat, uNetFade, uDPR, uContain;',
      'varying vec3 vColor; varying float vAlpha;',
      PALETTE, FOG_CHUNK,
      'void main(){',
      '  float th = aThreat * uThreat * (1.0 - uContain);',
      '  float t = fract(uTime*aSpd + aOff);',
      // corrupted packets stutter and run backwards
      '  t = mix(t, fract(-uTime*aSpd*1.7 + aOff + sin(uTime*9.0+aOff*30.0)*0.2), th);',
      '  vec3 p = mix(aA, aB, t);',
      '  vec4 mv = modelViewMatrix * vec4(p, 1.0);',
      '  float depth = -mv.z;',
      '  float fog = fogMix(depth);',
      '  vec3 col = mix(C_DEEP, C_INK, th);',
      '  vColor = mix(col, vec3(1.0), fog*0.9);',
      '  float head = sin(t*3.1415);',
      '  vAlpha = (1.0 - fog) * uNetFade * (0.35 + 0.65*head);',
      '  gl_PointSize = (1.9 + head*1.6) * uDPR * (240.0/max(depth,1.0));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vColor; varying float vAlpha;',
      'void main(){',
      '  float d = length(gl_PointCoord - 0.5);',
      '  if(d > 0.5) discard;',
      '  float a = smoothstep(0.5, 0.05, d) * vAlpha;',
      '  if(a < 0.004) discard;',
      '  gl_FragColor = vec4(vColor, a);',
      '}'
    ].join('\n')
  });
  var pts = new THREE.Points(g, m);
  pts.frustumCulled = false;
  scene.add(pts);
  return pts;
})();

/* --------------------------------------------------------------------------
   ParticleField — atmospheric dust, gives the void a scale
   -------------------------------------------------------------------------- */
(function buildDust() {
  var n = Q.dust;
  var pos = new Float32Array(n * 3);
  var seed = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    pos[i*3]   = (hash(i*1.3) - 0.5) * 420;
    pos[i*3+1] = (hash(i*2.7) - 0.5) * 300;
    pos[i*3+2] = lerp(Z_NEAR + 40, Z_FAR - 60, hash(i*4.9));
    seed[i] = hash(i*8.8);
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  g.setAttribute('aSeed', new THREE.BufferAttribute(seed, 1));
  var m = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false,
    vertexShader: [
      'attribute float aSeed;',
      'uniform float uTime, uFogD, uDPR;',
      'varying float vAlpha;',
      FOG_CHUNK,
      'void main(){',
      '  vec3 p = position;',
      '  p.y += sin(uTime*0.22 + aSeed*40.0)*4.0;',
      '  p.x += cos(uTime*0.17 + aSeed*28.0)*4.0;',
      '  vec4 mv = modelViewMatrix * vec4(p,1.0);',
      '  float depth = -mv.z;',
      '  vAlpha = (1.0 - fogMix(depth)) * (0.10 + 0.16*aSeed);',

var ATTACK_PTS = [
  new THREE.Vector3(-34,   6, -430),
  new THREE.Vector3(-14,  -8, -470),
  new THREE.Vector3(  8,  12, -510),
  new THREE.Vector3( 26,  -6, -548),
  new THREE.Vector3( 40,   8, -586)

(function buildAttackPath() {
  var curve = new THREE.CatmullRomCurve3(ATTACK_PTS);
  var SEG = 220;
  var pts = curve.getPoints(SEG);
  var lp = new Float32Array(SEG * 6);
  var lt = new Float32Array(SEG * 2);
  for (var i = 0; i < SEG; i++) {
    var a = pts[i], b = pts[i + 1];
    lp[i*6] = a.x; lp[i*6+1] = a.y; lp[i*6+2] = a.z;
    lp[i*6+3] = b.x; lp[i*6+4] = b.y; lp[i*6+5] = b.z;
    lt[i*2] = i / SEG; lt[i*2+1] = (i + 1) / SEG;
  }
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(lp, 3));
  g.setAttribute('aT', new THREE.BufferAttribute(lt, 1));
  var m = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false,
    vertexShader: [
      'attribute float aT;',
      'uniform float uTime, uFogD, uAttack, uContain;',
      'varying vec3 vColor; varying float vAlpha;',
      PALETTE, FOG_CHUNK,
      'void main(){',
      '  vec4 mv = modelViewMatrix * vec4(position,1.0);',
      '  float fog = fogMix(-mv.z);',
      '  float reached = smoothstep(uAttack, uAttack-0.06, aT);',
      '  float head = 1.0 - smoothstep(0.0, 0.05, abs(aT - uAttack));',
      '  vec3 col = mix(C_INK, C_ELECTRIC, uContain);',
      '  vColor = mix(col, vec3(1.0), fog*0.85);',
      '  vAlpha = reached * (0.30 + head*0.7) * (1.0 - fog);',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying vec3 vColor; varying float vAlpha;',
      'void main(){ if(vAlpha < 0.004) discard; gl_FragColor = vec4(vColor, vAlpha); }'
    ].join('\n')
  });
  var line = new THREE.LineSegments(g, m);
  line.frustumCulled = false;
  scene.add(line);

  // payload racing ahead of the drawn path
  var N = MOBILE ? 30 : 90;
  var ppos = new Float32Array(N * 3);
  var pseed = new Float32Array(N);
  for (var k = 0; k < N; k++) {
    var v = curve.getPoint(k / N);
    ppos[k*3] = v.x; ppos[k*3+1] = v.y; ppos[k*3+2] = v.z;
    pseed[k] = k / N;
  }
  var pg = new THREE.BufferGeometry();
  pg.setAttribute('position', new THREE.BufferAttribute(ppos, 3));
  pg.setAttribute('aT', new THREE.BufferAttribute(pseed, 1));
  var pm = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false,
    vertexShader: [
      'attribute float aT;',
      'uniform float uTime, uFogD, uAttack, uDPR, uContain;',
      'varying float vAlpha; varying vec3 vColor;',
      PALETTE, FOG_CHUNK,
      'void main(){',
      '  vec4 mv = modelViewMatrix * vec4(position,1.0);',
      '  float depth = -mv.z; float fog = fogMix(depth);',
      '  float near = 1.0 - smoothstep(0.0, 0.10, abs(aT - uAttack));',
      '  vColor = mix(mix(C_INK, C_ELECTRIC, uContain), vec3(1.0), fog*0.8);',
      '  vAlpha = near * (1.0 - fog);',
      '  gl_PointSize = (2.0 + near*5.0) * uDPR * (240.0/max(depth,1.0));',
      '  gl_Position = projectionMatrix * mv;',
      '}'
    ].join('\n'),
    fragmentShader: [
      'varying float vAlpha; varying vec3 vColor;',
      'void main(){',
      '  float d = length(gl_PointCoord-0.5); if(d>0.5) discard;',
      '  float a = smoothstep(0.5,0.05,d)*vAlpha; if(a<0.004) discard;',
      '  gl_FragColor = vec4(vColor, a);',

  });

  scene.add(pp);
})();

var DEFENSE = (function buildDefense() {
  var group = new THREE.Group();
  group.position.copy(U.uEpicentre.value);

  var ringMat = new THREE.ShaderMaterial({
    uniforms: U, transparent: true, depthWrite: false, side: THREE.DoubleSide,

      'uniform float uFogD, uContain;',

  var shellGeo = new THREE.IcosahedronGeometry(30, 1);

    new THREE.WireframeGeometry(shellGeo),
    new THREE.ShaderMaterial({

(function buildHuman() {

  x.beginPath(); x.moveTo(88, 190); x.quadraticCurveTo(92, 244, 90, 292); x.stroke();

        var jx = (Math.random() - 0.5) * step;
        var jy = (Math.random() - 0.5) * step;
        target.push(
          ((px + jx) - W / 2) * 0.16,

  }

  var pos = new Float32Array(n * 3);
  var tgt = new Float32Array(target);
  var src = new Float32Array(n * 3);
  var seed = new Float32Array(n);
  for (var i = 0; i < n; i++) {
    src[i*3]   = (hash(i * 1.9) - 0.5) * 220;
    src[i*3+1] = (hash(i * 4.1) - 0.5) * 180;

    uniforms: U, transparent: true, depthWrite: false,

      'attribute vec3 aTarget; attribute vec3 aSource; attribute float aSeed;',
      'uniform float uTime, uFogD, uHuman, uDPR;',

      'void main(){',
      '  float t = smoothstep(0.0, 1.0, clamp(uHuman*1.35 - aSeed*0.35, 0.0, 1.0));',
      '  vec3 p = mix(aSource, aTarget, t);',
      '  p += vec3(sin(uTime*0.7+aSeed*30.0), cos(uTime*0.6+aSeed*24.0), sin(uTime*0.5+aSeed*18.0)) * (0.32 + (1.0-t)*3.0);',
      '  vec4 mv = modelViewMatrix * vec4(p,1.0);',
      '  float depth = -mv.z; float fog = fogMix(depth);',
      '  vColor = mix(mix(C_DEEP, C_ELECTRIC, aSeed), vec3(1.0), fog*0.7);',
      '  vAlpha = uHuman * (0.30 + 0.55*t) * (1.0 - fog*0.75);',
      '  gl_PointSize = (1.0 + aSeed*1.5) * uDPR * (230.0/max(depth,1.0));',

    ].join('\n'),
    fragmentShader: [
      'varying float vAlpha; varying vec3 vColor;',

      var d = buf.getChannelData(c);
      for (var i = 0; i < len; i++) {
        d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
      }
    }
    return buf;
  }

  function build() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    ctx = new AC();

    master = ctx.createGain(); master.gain.value = 0;
    var comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -22; comp.ratio.value = 4; comp.release.value = 0.35;
    master.connect(comp); comp.connect(ctx.destination);

    var verb = ctx.createConvolver();
    verb.buffer = impulse(3.4, 2.6);
    wet = ctx.createGain(); wet.gain.value = 0.55;
    dry = ctx.createGain(); dry.gain.value = 0.75;
    verb.connect(wet); wet.connect(master); dry.connect(master);

    padFilter = ctx.createBiquadFilter();
    padFilter.type = 'lowpass'; padFilter.frequency.value = 300; padFilter.Q.value = 1.1;
    padGain = ctx.createGain(); padGain.gain.value = 0.30;
    padFilter.connect(padGain); padGain.connect(dry); padGain.connect(verb);

    /* pad voices: two detuned oscillators each, frequencies glide on scene change */
    for (var v = 0; v < 6; v++) {
      var g = ctx.createGain(); g.gain.value = 0;
      var o1 = ctx.createOscillator(); o1.type = 'sawtooth';
      var o2 = ctx.createOscillator(); o2.type = 'sine';
      o1.detune.value = -6; o2.detune.value = 7;
      var lfo = ctx.createOscillator(); lfo.frequency.value = 0.04 + v * 0.017;
      var lg = ctx.createGain(); lg.gain.value = 4.5;
      lfo.connect(lg); lg.connect(o1.detune);
      o1.connect(g); o2.connect(g); g.connect(padFilter);
      o1.start(); o2.start(); lfo.start();
      voices.push({ g: g, o1: o1, o2: o2 });
    }

    /* sub: felt more than heard, rises with the attack */
    bassGain = ctx.createGain(); bassGain.gain.value = 0;
    bass = ctx.createOscillator(); bass.type = 'sine';
    bass.frequency.value = midi(33);
    bass.connect(bassGain); bassGain.connect(dry);
    bass.start();

    /* sequence bus */
    var delay = ctx.createDelay(1.2);
    delay.delayTime.value = 0.42;
    var fb = ctx.createGain(); fb.gain.value = 0.34;
    arpGain = ctx.createGain(); arpGain.gain.value = 0;
    arpGain.connect(dry); arpGain.connect(verb);
    arpGain.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(verb);

    ready = true;
    setChord(scene, 0.05);
    schedule();
    return true;
  }

  function setChord(i, glide) {
    if (!ready) return;
    var c = CHORDS[i] || CHORDS[0];
    var t = ctx.currentTime, gl = glide === undefined ? 2.6 : glide;
    for (var v = 0; v < voices.length; v++) {
      var note = c.pad[v];
      var voice = voices[v];
      if (note === undefined) {
        voice.g.gain.cancelScheduledValues(t);
        voice.g.gain.linearRampToValueAtTime(0, t + gl);
        continue;
      }
      var f = midi(note);
      voice.o1.frequency.cancelScheduledValues(t);
      voice.o2.frequency.cancelScheduledValues(t);
      voice.o1.frequency.exponentialRampToValueAtTime(f, t + gl);
      voice.o2.frequency.exponentialRampToValueAtTime(f * 2, t + gl);
      voice.g.gain.cancelScheduledValues(t);
      voice.g.gain.linearRampToValueAtTime(0.16 / (1 + v * 0.35), t + gl);
    }
    bass.frequency.cancelScheduledValues(t);
    bass.frequency.exponentialRampToValueAtTime(midi(c.pad[0] - 12), t + gl);
  }

  function pluck(freq, when, level) {
    var o = ctx.createOscillator(), g = ctx.createGain(), f = ctx.createBiquadFilter();
    o.type = 'triangle'; o.frequency.value = freq;
    f.type = 'bandpass'; f.frequency.value = freq * 1.8; f.Q.value = 2.2;
    g.gain.setValueAtTime(0, when);
    g.gain.linearRampToValueAtTime(level, when + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, when + 1.05);
    o.connect(f); f.connect(g); g.connect(arpGain);
    o.start(when); o.stop(when + 1.1);
  }

  /* the sequence only exists while the visitor is moving through the system */
  function schedule() {
    if (arpTimer) clearInterval(arpTimer);
    var next = 0;
    arpTimer = setInterval(function () {
      if (!ready || !on) return;
      var c = CHORDS[scene] || CHORDS[0];
      var now = ctx.currentTime;
      if (next < now) next = now + 0.05;
      while (next < now + 0.4) {
        var e = energy * duck;
        if (e > 0.06 && Math.random() < 0.35 + e * 0.55) {
          var n = c.arp[(step + (Math.random() < 0.3 ? 2 : 1)) % c.arp.length];
          pluck(midi(n), next, 0.03 + e * 0.10);
          if (Math.random() < e * 0.4) pluck(midi(n + 12), next + c.rate * 0.5, 0.015 + e * 0.04);
        }
        step++;
        next += c.rate;
      }
    }, 90);
  }

  return {
    toggle: function () {
      if (!ctx && !build()) return false;
      if (ctx.state === 'suspended') ctx.resume();
      on = !on;
      var t = ctx.currentTime;
      master.gain.cancelScheduledValues(t);
      master.gain.linearRampToValueAtTime(on ? 0.5 : 0.0, t + (on ? 1.6 : 0.7));
      return on;
    },
    isOn: function () { return on; },
    setScene: function (i) {
      if (i === scene) return;
      scene = i;
      if (ready && on) { setChord(i, 3.0); this.whoosh(); }
      else scene = i;
    },
    /* energy = how fast the visitor is travelling; drives brightness and density */
    frame: function (speed, p, dt) {
      if (!ready || !on) return;
      targetEnergy = clamp(speed * 26, 0, 1);
      energy += (targetEnergy - energy) * Math.min(1, dt * 2.2);
      /* the silence after the breach is part of the score */
      duck = 1 - window4(p, 0.540, 0.566, 0.600, 0.640) * 0.92;
      var t = ctx.currentTime;
      padFilter.frequency.setTargetAtTime(230 + energy * 1500 + p * 520, t, 0.25);
      padGain.gain.setTargetAtTime((0.20 + energy * 0.16) * duck, t, 0.3);
      arpGain.gain.setTargetAtTime((0.10 + energy * 0.55) * duck, t, 0.2);
      bassGain.gain.setTargetAtTime((0.05 + window4(p, 0.40, 0.46, 0.54, 0.60) * 0.16) * duck, t, 0.4);
      wet.gain.setTargetAtTime(0.42 + (1 - energy) * 0.28, t, 0.5);
    },
    whoosh: function () {
      if (!ready || !on) return;
      var len = Math.floor(ctx.sampleRate * 1.6);
      var buf = ctx.createBuffer(1, len, ctx.sampleRate);
      var d = buf.getChannelData(0);
      for (var i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 1.6);
      var src = ctx.createBufferSource(); src.buffer = buf;
      var f = ctx.createBiquadFilter(); f.type = 'bandpass'; f.Q.value = 3.5;
      var g = ctx.createGain(); g.gain.value = 0.10;
      var t = ctx.currentTime;
      f.frequency.setValueAtTime(320, t);
      f.frequency.exponentialRampToValueAtTime(2600, t + 1.4);
      g.gain.exponentialRampToValueAtTime(0.0005, t + 1.5);
      src.connect(f); f.connect(g); g.connect(wet);
      src.start(t); src.stop(t + 1.6);
    },
    ping: function (freq, level) {
      if (!ready || !on) return;
      var t = ctx.currentTime;
      pluck(freq, t + 0.01, level || 0.05);
    }
  };
})();

function esc(x) { return String(x).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }

/* --------------------------------------------------------------------------
   Personal channels. The address and the number are never written into the
   document — not as text, not as an href. They are assembled in the browser
   and only attached after a human hovers, focuses or taps the link, so a
   crawler scraping the served HTML finds nothing to harvest.
   -------------------------------------------------------------------------- */
var CH = { mail: ['aWF6di5pdmFu', 'Z21haWwuY29t'], tel: ['KzM0NjQzOTk4Mjk0'] };
function reveal(kind) {
  try {
    if (kind === 'mail') return 'mailto:' + atob(CH.mail[0]) + String.fromCharCode(64) + atob(CH.mail[1]);
    if (kind === 'tel')  return 'tel:' + atob(CH.tel[0]);
  } catch (e) {}
  return '#';
}
function armContacts(root) {
  (root || document).querySelectorAll('a[data-p]').forEach(function (a) {
    if (a._armed) return;
    a._armed = true;
    var kind = a.getAttribute('data-p');
    var arm = function () { if (a.getAttribute('href') === '#') a.setAttribute('href', reveal(kind)); };
    a.addEventListener('mouseenter', arm);
    a.addEventListener('focus', arm);
    a.addEventListener('touchstart', arm, { passive: true });
    a.addEventListener('click', function (e) {
      if (a.getAttribute('href') === '#') { e.preventDefault(); window.location.href = reveal(kind); }
    });
  });
}

  /* 08 — qualifications */

    out.push('<h4>' + esc(c.title) + '</h4>');
    out.push('<div class="fields">' + c.fields.map(function (f) {
      return '<div>' + esc(f.k) + ' &nbsp;<em>' + esc(f.v) + '</em></div>';

    if (c.modules && c.modules.length) {
      out.push('<details><summary>' + esc(c.moreLabel) + '</summary><div class="mods">');
      c.modules.forEach(function (m) {
        out.push('<div><h5>' + esc(m.h) + '</h5><ul>' + m.items.map(function (it) {
          return '<li>' + esc(it) + '</li>';
        }).join('') + '</ul></div>');
      });
      out.push('</div></details>');
    }
    out.push('</article>');
  });
  out.push('<p class="lede" style="font-size:12.5px;margin-top:22px">' + esc(O.credsNote) + '</p>');
  out.push('</section>');

  /* 09 — experience */
  out.push('<section class="sec"><div class="sec-h"><b>09</b><h3>' + esc(O.careerTitle) + '</h3></div>');
  O.career.forEach(function (e) {
    out.push('<article class="entry"><div class="when">' + esc(e.when) + '</div><div>');
    out.push('<h4>' + esc(e.title) + '</h4><p class="org">' + esc(e.org) + '</p><p>' + esc(e.body) + '</p>');
    out.push('</div></article>');
  });
  out.push('</section>');

  /* 10 — capabilities */
  out.push('<section class="sec"><div class="sec-h"><b>10</b><h3>' + esc(O.skillsTitle) + '</h3></div><div class="cols">');
  O.skillGroups.forEach(function (g) {
    out.push('<div><h5>' + esc(g.h) + '</h5><div class="chips">' + g.chips.map(function (c, i) {
      return '<span' + (i < (g.key || 0) ? ' class="key"' : '') + '>' + esc(c) + '</span>';
    }).join('') + '</div></div>');
  });
  out.push('</div></section>');

  /* contact */
  out.push('<section class="sec"><div class="contact"><div>');
  out.push('<p class="big">' + esc(O.contactH) + '</p>');
  out.push('<p class="lede" style="font-size:14px;margin-top:18px">' + esc(O.contactNote) + '</p></div>');
  out.push('<div class="ways">' + O.ways.map(function (w) {
    if (w.protect) return '<a href="#" data-p="' + w.protect + '">' + esc(w.t) + '</a>';
    return '<a href="' + w.href + '" target="_blank" rel="noopener">' + esc(w.t) + '</a>';
  }).join('') + '</div></div>');
  out.push('<div class="colophon">' + O.colophon.map(function (c) { return '<span>' + esc(c) + '</span>'; }).join('') + '</div>');
  out.push('</section>');

  host.innerHTML = out.join('');
  armContacts(host);
}

  PROJECTS = C.projects;
  var infoIdx = 0;
  for (var i = 0; i < POI.length; i++) {

    var src = C.poi[POI[i].info !== undefined ? POI[i].info : infoIdx++];

  if (skip) skip.textContent = C.skip;

  var ab = document.getElementById('audio');
  if (ab) ab.textContent = (typeof audio !== 'undefined' && audio.isOn && audio.isOn()) ? C.soundOn : C.soundOff;
  if (typeof hintEl !== 'undefined' && hintEl) hintEl.textContent = C.hint;

  if (typeof buildBeats === 'function' && document.getElementById('statements')) buildBeats();

  if (typeof labelEls !== 'undefined' && labelEls) {
    for (var l = 0; l < labelEls.length; l++) {

      labelEls[l].querySelector('.t').textContent = lc.t;

/* ============================================================================
   7. LOOP
   ========================================================================== */
var pTarget = 0, pNow = 0, lastScene = -1, pulsePlayed = false;
var pPrev = 0, travelSpeed = 0;
var proj = new THREE.Vector3();
var vNdc = new THREE.Vector3(), vDir = new THREE.Vector3();
var clock = new THREE.Clock();
var visible = true;

function readScroll() {
  var h = trackHeight();
  pTarget = clamp(window.scrollY / (h > 0 ? h : 1), 0, 1);
  // past the track you leave the system and land on the readable layer
  body.classList.toggle('landed', window.scrollY > h + window.innerHeight * 0.35);
}
window.addEventListener('scroll', readScroll, { passive: true });
readScroll();

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, Q.dpr));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  U.uDPR.value = renderer.getPixelRatio();
  readScroll();
}
window.addEventListener('resize', onResize);
document.addEventListener('visibilitychange', function () { visible = !document.hidden; });

function project3(v) {
  proj.copy(v).project(camera);
  return {
    x: (proj.x * 0.5 + 0.5) * window.innerWidth,
    y: (-proj.y * 0.5 + 0.5) * window.innerHeight,
    infront: proj.z < 1
  };
}

var t0 = performance.now();
function frame() {
  requestAnimationFrame(frame);
  if (!visible) return;

  var dt = Math.min(clock.getDelta(), 0.05);
  var time = (performance.now() - t0) * 0.001;
  U.uTime.value = time;

  /* --- scroll smoothing: motion has to feel expensive --------------------- */
  pNow += (pTarget - pNow) * (REDUCED ? 0.5 : 1 - Math.pow(0.0009, dt));
  var p = pNow;

  /* how fast the visitor is travelling — the score listens to this */
  var inst = Math.abs(p - pPrev) / Math.max(dt, 0.001);
  pPrev = p;
  travelSpeed += (inst - travelSpeed) * 0.12;
  audio.frame(travelSpeed, p, dt);

  /* --- narrative state ---------------------------------------------------- */
  U.uThreat.value  = smooth(range(p, 0.232, 0.320));
  U.uAttack.value  = range(p, 0.424, 0.556);
  U.uContain.value = smooth(range(p, 0.612, 0.742));
  U.uHuman.value   = window4(p, 0.762, 0.800, 0.868, 0.888);
  U.uNetFade.value = 1 - window4(p, 0.756, 0.792, 0.872, 0.900) * 0.88;
  U.uFogD.value    = lerp(0.0062, 0.00058, smooth(range(p, 0.855, 0.985)));

  var pulseT = range(p, 0.612, 0.700);
  U.uPulse.value = pulseT > 0 && pulseT < 1 ? pulseT * 420 : 0;
  if (pulseT > 0.05 && !pulsePlayed) { pulsePlayed = true; audio.ping(320, 0.10); }
  if (pulseT === 0) pulsePlayed = false;

  /* --- camera ------------------------------------------------------------- */
  sampleCamera(p);
  var driftAmp = REDUCED ? 0 : 1;
  pointerLerp.x += ((mouse.active ? mouse.nx : 0) - pointerLerp.x) * 0.045;
  pointerLerp.y += ((mouse.active ? mouse.ny : 0) - pointerLerp.y) * 0.045;
  camera.position.set(
    camPos.x + pointerLerp.x * 6 * driftAmp + Math.sin(time * 0.21) * 1.6 * driftAmp,
    camPos.y + pointerLerp.y * 4 * driftAmp + Math.cos(time * 0.17) * 1.2 * driftAmp,
    camPos.z
  );
  camera.lookAt(camLook);
  camera.rotation.z = Math.sin(time * 0.13) * 0.012 * driftAmp + pointerLerp.x * 0.01;

  /* --- cursor field in world space ---------------------------------------- */
  if (mouse.active && !REDUCED) {
    vNdc.set(mouse.nx, mouse.ny, 0.5).unproject(camera);
    vDir.copy(vNdc).sub(camera.position).normalize();
    U.uMouse.value.copy(camera.position).addScaledVector(vDir, 70);
    U.uMouseAmp.value += (1 - U.uMouseAmp.value) * 0.05;
  } else {
    U.uMouseAmp.value += (0 - U.uMouseAmp.value) * 0.05;
  }

  /* --- defense structures ------------------------------------------------- */
  DEFENSE.group.rotation.y = time * 0.06;
  DEFENSE.group.rotation.x = Math.sin(time * 0.05) * 0.2;
  for (var r = 0; r < DEFENSE.rings.length; r++) {
    DEFENSE.rings[r].rotation.z = time * (0.06 + r * 0.03) * (r % 2 ? -1 : 1);
    var s = lerp(2.2, 1, U.uContain.value);
    DEFENSE.rings[r].scale.setScalar(s);
  }
  DEFENSE.shell.rotation.y = -time * 0.04;

  /* --- typography beats --------------------------------------------------- */
  for (var bi = 0; bi < BEATS.length; bi++) {
    var B = BEATS[bi];
    var el = beatEls[B[0]];
    if (!el) continue;
    var o = window4(p, B[1], B[2], B[3], B[4]);
    if (o !== el._o) {
      el.style.opacity = o;
      el.style.transform = 'translateY(' + ((1 - o) * 14).toFixed(2) + 'px)';
      el._o = o;
    }
  }
  whiteout.style.opacity = window4(p, 0.548, 0.576, 0.598, 0.628) * 0.97;
  var ctaO = window4(p, 0.952, 0.972, 1.001, 1.002);
  ctaEl.style.opacity = ctaO;
  ctaEl.style.pointerEvents = ctaO > 0.6 ? 'auto' : 'none';

  /* --- spatial labels ----------------------------------------------------- */
  for (var li = 0; li < LABELS.length; li++) {
    var L = LABELS[li], le = labelEls[li];
    var o2 = window4(p, L.p0, L.p0 + 0.018, L.p1 - 0.02, L.p1);
    if (o2 <= 0.001) {
      if (L.shown) { le.style.opacity = 0; L.shown = false; }
      continue;
    }
    L.shown = true;
    var s2 = project3(L.v);
    if (!s2.infront) { le.style.opacity = 0; continue; }
    le.style.opacity = o2 * 0.95;
    le.style.transform = 'translate(-50%,-50%) translate(' + s2.x.toFixed(1) + 'px,' + s2.y.toFixed(1) + 'px)';
  }

  /* --- node proximity + inspector ----------------------------------------- */
  var best = -1, bestD = COARSE ? 70 : 110;
  var hotAttr = poiObjects.hotAttr;
  for (var pi = 0; pi < POI.length; pi++) {
    var sp = project3(POI[pi].v);
    POI[pi]._s = sp;
    if (sp.infront && mouse.active) {
      var dx = sp.x - mouse.x, dy = sp.y - mouse.y;
      var d = Math.sqrt(dx * dx + dy * dy);
      if (d < bestD) { bestD = d; best = pi; }
    }
    hotAttr.array[pi] += (0 - hotAttr.array[pi]) * 0.18;
  }
  if (best >= 0) hotAttr.array[best] += (1 - hotAttr.array[best]) * 0.25;
  hotAttr.needsUpdate = true;

  if (best !== hovered) {
    hovered = best;
    lens.classList.toggle('hot', best >= 0);
    if (best >= 0) {
      var poi = POI[best];
      var C = T();
      if (poi.kind === 3) {
        var pr = PROJECTS[poi.project];
        iName.textContent = pr.idx;
        iMeta.textContent = pr.title + ' — ' + pr.tag;
        iRisk.textContent = C.caseStudy;
        iMore.textContent = COARSE ? C.exploreTouch : C.explore;
      } else {
        iName.textContent = poi.name;
        iMeta.textContent = poi.meta;
        iRisk.textContent = C.riskLabel + poi.risk;
        iMore.textContent = '';
      }
      audio.ping(660, 0.05);
    }
  }
  if (hovered >= 0 && POI[hovered]._s && POI[hovered]._s.infront) {
    var hs = POI[hovered]._s;
    inspector.style.opacity = 1;
    inspector.style.transform = 'translate(' + (hs.x + 26).toFixed(1) + 'px,' + hs.y.toFixed(1) + 'px) translateY(-50%)';
  } else {
    inspector.style.opacity = 0;
  }

  /* --- chrome ------------------------------------------------------------- */
  var sc = 0;
  for (var si = 0; si < SCENES.length; si++) if (p >= SCENES[si].p0) sc = si;
  if (sc !== lastScene) {
    lastScene = sc;
    sceneLabel.textContent = SCENES[sc].id + ' — ' + T().scenes[sc];
    navBtns.forEach(function (b, i) { b.classList.toggle('active', i === sc); });
    audio.setScene(sc);
  }
  if (p > 0.02 && hintEl.style.opacity !== '0') hintEl.style.opacity = '0';

  renderer.render(scene, camera);
}
requestAnimationFrame(frame);

/* Keyboard: the journey has to be traversable without a mouse */
window.addEventListener('keydown', function (e) {
  if (e.key === 'ArrowRight') { goTo(clamp(pTarget + 0.06, 0, 1)); }
  if (e.key === 'ArrowLeft')  { goTo(clamp(pTarget - 0.06, 0, 1)); }
});

})();

</script>
